<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Rastreador de Entrenamiento - Inicio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap');
        body { font-family: 'Nunito', sans-serif; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    </style>
</head>
<body class="bg-[#d9ede5] min-h-screen flex items-center justify-center p-4 sm:p-8">

    <div class="w-full max-w-[1400px] h-[calc(100vh-4rem)] bg-white rounded-[3rem] shadow-2xl overflow-hidden flex flex-row">
        
        <!-- Dark Sidebar -->
        <div class="w-24 bg-[#0c1210] flex flex-col items-center py-8 text-gray-400 z-10 shrink-0">
            <div class="mb-12"><svg class="w-10 h-10 text-[#f19b5b] transform -rotate-45" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M6.5 6.5h-2v11h2v-11z"/><path d="M17.5 6.5h2v11h-2v-11z"/><path d="M6.5 10.5h11v3h-11v-3z"/><path d="M2 8.5h2.5v7H2v-7z"/><path d="M19.5 8.5H22v7h-2.5v-7z"/></svg></div>
            
            <a href="/dashboard" class="mb-8 text-white transition flex flex-col items-center relative group">
                <span class="absolute -left-4 top-1/2 -translate-y-1/2 w-1 h-6 bg-[#f19b5b] rounded-r-lg"></span>
                <svg class="w-6 h-6 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"></path></svg>
                <span class="text-[10px] text-[#9ec88c]">Inicio</span>
            </a>
            
            <a href="/plans" class="mb-8 hover:text-white transition flex flex-col items-center">
                <svg class="w-6 h-6 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-3 7h3m-3 4h3m-6-4h.01M9 16h.01"></path></svg>
                <span class="text-[10px]">Planes</span>
            </a>
            
            <a href="/exercises" class="mb-8 hover:text-white transition flex flex-col items-center">
                <svg class="w-6 h-6 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 6l3 1m0 0l-3 9a5.002 5.002 0 006.001 0M6 7l3 9M6 7l6-2m6 2l3-1m-3 1l-3 9a5.002 5.002 0 006.001 0M18 7l3 9m-3-9l-6-2m0-2v2m0 16V5m0 16H9m3 0h3"></path></svg>
                <span class="text-[10px]">Ejercicios</span>
            </a>
            
            <div class="mt-auto flex flex-col space-y-6">
                <button onclick="logout()" class="hover:text-[#f19b5b] transition">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path></svg>
                </button>
            </div>
        </div>

        <!-- Main Content -->
        <div class="flex-1 bg-[#fcfdfd] overflow-y-auto">
            <div class="p-8 lg:p-12">
                <!-- Header -->
                <div class="flex justify-between items-center mb-10">
                    <div>
                        <h1 class="text-4xl font-bold text-gray-800 tracking-tight">Hola, <span id="nav-username"></span></h1>
                        <p class="text-gray-500 mt-2">¡Sigue tu salud todos los días!</p>
                    </div>
                </div>

                <!-- Content -->
                <div class="space-y-8 max-w-4xl">
                    <div class="flex justify-between items-center">
                        <h2 class="text-xl font-bold text-gray-800">Tus Actividades</h2>
                    </div>
                    
                    <!-- Tarjeta Planes -->
                    <div class="bg-white p-8 rounded-3xl shadow-sm border border-gray-100 flex items-center justify-between">
                        <div class="flex items-center space-x-6">
                            <div class="w-16 h-16 bg-[#e6f0ec] rounded-2xl flex items-center justify-center">
                                <svg class="w-8 h-8 text-[#9ec88c]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-3 7h3m-3 4h3m-6-4h.01M9 16h.01"></path></svg>
                            </div>
                            <div>
                                <h3 class="text-lg font-bold text-gray-800">Mis Planes</h3>
                                <p class="text-sm text-gray-500">Organiza tus rutinas diarias</p>
                            </div>
                        </div>
                        <a href="/plans" class="bg-[#9ec88c] text-white px-6 py-2 rounded-full font-semibold hover:bg-[#8eb87c] shadow transition">Ir a Planes</a>
                    </div>

                    <!-- Tarjeta Ejercicios -->
                    <div class="bg-white p-8 rounded-3xl shadow-sm border border-gray-100 flex items-center justify-between mt-6">
                        <div class="flex items-center space-x-6">
                            <div class="w-16 h-16 bg-[#fff3e0] rounded-2xl flex items-center justify-center">
                                <svg class="w-8 h-8 text-[#f19b5b]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 6l3 1m0 0l-3 9a5.002 5.002 0 006.001 0M6 7l3 9M6 7l6-2m6 2l3-1m-3 1l-3 9a5.002 5.002 0 006.001 0M18 7l3 9m-3-9l-6-2m0-2v2m0 16V5m0 16H9m3 0h3"></path></svg>
                            </div>
                            <div>
                                <h3 class="text-lg font-bold text-gray-800">Mis Ejercicios</h3>
                                <p class="text-sm text-gray-500">Catálogo personalizado</p>
                            </div>
                        </div>
                        <a href="/exercises" class="bg-[#f19b5b] text-white px-6 py-2 rounded-full font-semibold hover:bg-[#e0894d] shadow transition">Ir a Ejercicios</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="/js/auth.js"></script>
    <script>
        checkAuth();
    </script>
</body>
</html>
